<!doctype html><html><head><meta charset="utf-8"><style>

</style></head><body><div id="root">

 <div class="layer face"><img class="logo" src="assets/Gemini-logo-2025-32a9eb8b.png"><div class="mn">GEMINI 4</div><div class="sq">(ARGON HIGH)</div><div class="hi" id="hiB"></div>

<div class="shadow" id="shP"></div><div class="abs" id="panel"><div id="panelBack" style="transform:translateZ(-14px) translate(5px,7px)"></div><div id="panelFace">

  <div class="rlab" style="top:92px">SONNET</div><div class="trk" style="top:100px"><div class="fill fa" id="f1a"></div></div>
  <div class="rlab" style="top:166px">ARGON</div><div class="trk" style="top:174px"><div class="fill fg" id="f1g"></div></div></div>

  <div class="rlab" style="top:92px">SONNET</div><div class="trk" style="top:100px"><div class="fill fa" id="f2a"></div></div>
  <div class="rlab" style="top:166px">ARGON</div><div class="trk" style="top:174px"><div class="fill fg" id="f2g"></div></div></div>

</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eo5=x=>1-Math.pow(1-x,5);
const bounce=x=>{ // soft bounce drop 0..1 ->position 0..1
 const n=7.5625,d=2.75; if(x<1/d)return n*x*x; if(x<2/d)return n*(x-=1.5/d)*x+.75; if(x<2.5/d)return n*(x-=2.25/d)*x+.9375; return n*(x-=2.625/d)*x+.984375;};
const softb=x=>{ // gentler: ease-out with one small rebound
 if(x<.62){const u=x/.62;return 1-Math.pow(1-u,2.2)*0+ (u*u)*0 + (1-Math.pow(1-u,2))*1.0*1}; const u=(x-.62)/.38; return 1-.06*Math.sin(Math.PI*u)*(1-u)*2;};
const lerp=(a,b,x)=>a+(b-a)*x;
// dots
(()=>{const c=$('dots').getContext('2d');c.fillStyle='#b9c3cf';for(let y=20;y<1920;y+=44)for(let x=20;x<1080;x+=44){c.beginPath();c.arc(x,y,2,0,7);c.fill();}})();
const CX=[62,482], CY=480, CW=392,CH=350;
const SC={A:[64,71],G:[57,78]};
function roll(el,show,y,blur){el.style.opacity=show;el.style.transform=`translateY(${y}px)`;el.style.filter=blur>0.2?`blur(${blur}px)`:'none';}
function setT(t){
 const idle=(p,a)=>a*Math.sin(2*Math.PI*t/6+p);
 // ---------- title swaps (coordinated exit up / enter from below, same position)
 const T=[[0,2.2],[2.2,6.4],[6.4,10.4]]; // visible windows
 const tt=[ [0,1.9,'t0'],[1.9,6.5,'t1'],[6.5,10.5,'t2'],[10.5,99,'t3'] ];
 tt.forEach(([a,b,id],i)=>{const el=$(id);
  const inn=seg(t,a,a+(i==0?.4:.55)), out=(i<3)?seg(t,b-.05,b+.35):0;
  let y=(1-eo(inn))*70-eio(out)*70, o=eo(inn)*(1-out), bl=(1-inn)*7+out*7;
  if(i==0){y=(1-eo(inn))*-60;o=Math.max(.2,eo(seg(t,0,.4)))*(1-out);}
  const base=el.classList.contains('vd')?0:0; el.style.opacity=o;el.style.transform=`translateY(${y}px)`;el.style.filter=bl>.3?`blur(${bl}px)`:'none';});
 // verdict extrusion (soft stacked)
 const v=$('t3');v.style.textShadow='0 1px 0 #9fb0d0,0 2px 0 #9aaccc,0 3px 0 #96a8c8,0 4px 0 #92a4c4,0 5px 0 #8fa1c1,0 6px 0 #8c9ebe,0 7px 0 #899bbb,0 8px 0 #8698b8,6px 14px 14px #5b6f8c55';
 // ---------- lights & parallax (content layers only)
 const lx=0.1+0.8*t/15, sx=(lx-.5);
 // ---------- cards
 const dropA=seg(t,0,1.1), dropB=seg(t,.12,1.25);
 const sway=(p)=>1.9*Math.sin(2*Math.PI*t/5+p);
 const turn=eio(seg(t,5.5,6.2))-eio(seg(t,6.2,7.0)); // 0..1..0 handoff 1
 const turn2=eio(seg(t,10.2,10.8))-eio(seg(t,10.8,11.5));
 const turnS=turn+0.6*turn2;
 const cards=[['cA','shA','hiA',0,dropA],['cB','shB','hiB',1,dropB]];
 cards.forEach(([cid,sid,hid,k,dr])=>{
  const sgn=k?1:-1;
  const y0=(1-softb(dr))*-(CY-200+0)*1.0; // from above, y -280
  const fall=-(1-softb(dr))*(CY-60);
  const squash=1-0.05*Math.sin(Math.PI*cl((dr-.52)/.25)) *(dr>.5&&dr<.77?1:0);
  const lift=14*turnS + 6 + idle(k*1.3,9)*.8;
  const dx=sgn*-10*turnS + idle(k*1.1,6)*1.0;      // parallax layer 1.0
  const rY=sgn*-1*(9*turnS)+idle(k,2.4);
  const rX=-3*turnS+idle(k*.7+1,2.0);
  const rZ=sway(k*2.1)*.6;
  const bl=(1-eo(dr))*9;
  const el=$(cid);
  el.style.left=(CX[k]+dx)+'px';
  el.style.transform=`translateY(${fall}px) translateZ(${lift}px) rotateX(${rX}deg) rotateY(${rY}deg) rotateZ(${rZ}deg) scaleY(${squash})`;
  el.style.opacity=Math.max(.35,eo(seg(dr,0,.12)));el.style.filter=bl>.3?`blur(${bl}px)`:'none';
  // cast + contact shadows follow elevation/light direction
  const sh=$(sid);const e=cl(lift/22,0,1.3);
  const sxo=-sx*64*(0.6+e*.4), syo=24+30*e;
  sh.style.left=(CX[k]+dx+sxo+14)+'px';sh.style.top=(CY+syo+16+fall*.98*0+0)+'px';
  sh.style.width=CW-24+'px';sh.style.height=CH-26+'px';
  sh.style.background=`rgba(80,98,128,${.34*eo(seg(dr,.78,1))})`;
  sh.style.filter=`blur(${16+e*10}px)`;
  sh.style.transform=`translateY(${fall*(1-eo(dr))*0}px)`;
  sh.style.opacity=1;
  const gp=((t*0.8+k*.35)%1.5)*130-30;
  // moving key light on face
  $(hid).style.background=`radial-gradient(ellipse 70% 55% at ${(lx*100+(k?-8:8)).toFixed(1)}% 4%,#ffffffd0 0%,#ffffff55 38%,transparent 72%),linear-gradient(112deg,transparent ${gp-14}%,#ffffff88 ${gp}%,transparent ${gp+10}%)`;
 });
 // ---------- wells (score numbers)
 const A1=64,B1=57,A2=71,B2=78;
 const c1=eo5(seg(t,2.6,4.1)); // count up 0 -> 64/57
 const c2=eio(seg(t,6.7,8.2)); // 64->71, 57->78
 const c3=eio(seg(t,10.6,11.4)); // recap crossfade
 function well(idA,idB,v1,v2,k){
  const e1=$(idA),e2=$(idB);
  // e1: live score (? -> count -> morph), e2: recap "64 | 71" in Anton 56
  const q=t<3.0; let txt;
  if(t<2.5){txt='?';} else if(t<6.7){txt=Math.round(v1*c1);} else {txt=Math.round(lerp(v1,v2,c2));}
  e1.textContent=txt;
  const pulse=t<2.6?1+0.04*Math.sin(t*6):1;
  e1.style.opacity=1-c3; e1.style.transform=`translateY(${-c3*50+1.8*Math.sin(t*4+k)}px) scale(${pulse})`;
  e1.style.filter=c3>0.05?`blur(${c3*5}px)`:'none';
  e2.textContent=(k?B1+' | '+B2:A1+' | '+A2);e2.style.fontSize='64px';
  e2.style.opacity=c3;e2.style.transform=`translateY(${(1-c3)*50}px)`;e2.style.filter=c3<.95?`blur(${(1-c3)*5}px)`:'none';
 }
 well('nA1','nA2',A1,A2,0);well('nB1','nB2',B1,B2,1);
 // ---------- panel (rises from below at 2.3; swaps content at 6.5; becomes CTA 11.5)
 const pin=seg(t,1.85,2.95), pe=1-Math.pow(1-pin,3)+0.012*Math.sin(Math.PI*pin)*pin;
 const toCTA=eio(seg(t,11.3,12.4));
 const pw=lerp(824,640,toCTA), ph=lerp(262,150,toCTA), px=lerp(56,148,toCTA), py=lerp(850,935,toCTA);
 const P=$('panel');
 const rise=(1-pe)*105;
 P.style.left=px+'px';P.style.top=(py+rise)+'px';P.style.width=pw+'px';P.style.height=ph+'px';
 const pdx=idle(2.2,3)*1.2, pr=-4*(1-pin)+idle(.4,.7)+1.2*turnS;
 P.style.transform=`translateX(${pdx}px) translateZ(${-6+4*Math.sin(t)}px) rotateX(${pr}deg) rotateY(${-1.5*turnS}deg)`;
 P.style.opacity=eo(seg(pin,0,.25));P.style.filter=pin<.9?`blur(${(1-pin)*8}px)`:'none';
 $('panelFace').style.background=toCTA>0?`linear-gradient(145deg,rgb(${lerp(255,32,toCTA)|0},${lerp(255,66,toCTA)|0},${lerp(255,112,toCTA)|0}),rgb(${lerp(255,0,toCTA)|0},${lerp(255,16,toCTA)|0},${lerp(255,48,toCTA)|0}))`:'#ffffffe8';
 $('panelFace').style.borderRadius=lerp(30,48,toCTA)+'px';$('panelBack').style.borderRadius=lerp(30,48,toCTA)+'px';
 // content swap 1 -> 2
 const sw=eio(seg(t,6.4,7.1)), sw2=eio(seg(t,11.2,11.9));
 const pc1=$('pc1'),pc2=$('pc2');
 pc1.style.opacity=(1-sw);pc1.style.transform=`translateY(${-sw*70}px)`;pc1.style.filter=sw>.05?`blur(${sw*6}px)`:'none';
 pc2.style.opacity=sw*(1-sw2);pc2.style.transform=`translateY(${(1-sw)*70-sw2*70}px)`;pc2.style.filter=(sw<.95||sw2>.05)?`blur(${(1-sw)*6+sw2*6}px)`:'none';
 pc1.style.visibility=t<7.3?'visible':'hidden';pc2.style.visibility=(t>6.3&&t<12.2)?'visible':'hidden';
 // bars
 const b1=eo5(seg(t,2.6,4.1)); const b2=eio(seg(t,6.7,8.2));
 const wA=(t<6.7?A1*b1:lerp(A1,A2,b2)), wG=(t<6.7?B1*b1:lerp(B1,B2,b2));
 $('f1a').style.width=(A1*b1)/100*100+'%';$('f1g').style.width=(B1*b1)/100*100+'%';
 $('f2a').style.width=(t<6.7?A1:lerp(A1,A2,b2))+'%';$('f2g').style.width=(t<6.7?B1:lerp(B1,B2,b2))+'%';
 [['f1a','#e6b79b,#bd7852'],['f1g','#abc2ee,#587fcb'],['f2a','#e6b79b,#bd7852'],['f2g','#abc2ee,#587fcb']].forEach(([id,c],i)=>{const p=((t*.9+i*.23)%1.6)*120-20;$(id).style.backgroundImage=`linear-gradient(110deg,transparent ${p-10}%,#ffffffa0 ${p}%,transparent ${p+10}%),linear-gradient(90deg,${c})`;});
 // CTA text
 const ct=$('cta');ct.style.left=0;ct.style.top=0;ct.style.width=pw+'px';ct.style.height=ph+'px';ct.style.lineHeight=ph+'px';
 ct.textContent='COMMENT VIDEO';const ce=eo(seg(t,11.9,12.7));ct.style.opacity=ce;ct.style.transform=`translateY(${(1-ce)*60}px)`;ct.style.filter=ce<.95?`blur(${(1-ce)*6}px)`:'none';
 ct.style.textShadow='0 1px 0 #5a79ad,0 2px 0 #4c6aa0,0 3px 0 #3e5b90,0 5px 8px #00000066';
 ct.style.backgroundImage=toCTA>.5?`linear-gradient(112deg,transparent ${((t*.6)%1.6)*120-40}%,#ffffff22 ${((t*.6)%1.6)*120-30}%,transparent ${((t*.6)%1.6)*120-20}%)`:'none';
 const shP=$('shP');shP.style.left=(px+14-sx*30)+'px';shP.style.top=(py+rise+26)+'px';shP.style.width=(pw-24)+'px';shP.style.height=(ph-20)+'px';shP.style.borderRadius='36px';shP.style.filter='blur(20px)';shP.style.background=`rgba(80,98,128,${.32*eo(seg(pin,.2,1))})`;
 // CTA breathing + light sweep
 if(t>12.7){const br=Math.sin((t-12.7)*2*Math.PI/1.6);P.style.top=(py+rise-3*br)+'px';}
 // ---------- tokens: sphere (Sonnet) and donut (Gemini)
 const TR=[56+250+8,0]; // track x0 in stage
 function tok(k,idT,idS){
  const el=$(idT),sh=$(idS);
  const tr0=(k?174:100); // track top in panel
  const ry=850+tr0+17; // bar centre y when panel at rest
  let x,y,sc=1,rotX=0,rotY=0;
  const rest=[ [CX[0]+CW-96, CY-42], [CX[1]+CW-96, CY-42] ][k];
  const trackX=(pct)=>56+250+pct*5.4;
  // phases: 0-2.9 rest on card corner; 2.9-3.5 hop to bar start; 3.5-4.5 rides bar head; 4.5-6.4 hold on bar head; 6.7-8.2 rides bar head to new; to 11.0 holds; 11.0-11.9 hops to card corner (verdict)
  let tk=t;
  const v1=[A1,B1][k], v2=[A2,B2][k];
  const barPos=(pct)=>[trackX(pct)-44,ry-44+0];
  let pos;
  if(t<2.5) {pos=rest;}
  else if(t<3.2){const u=eio(seg(t,2.5,3.2));const s=barPos(0);pos=[lerp(rest[0],s[0],u),lerp(rest[1],s[1],u)-Math.sin(Math.PI*u)*120];}
  else if(t<6.7){pos=barPos(v1*eo5(seg(t,2.6,4.1)));if(t<3.2)pos=barPos(0);}
  else if(t<8.2){pos=barPos(lerp(v1,v2,eio(seg(t,6.7,8.2))));}
  else if(t<11.0){pos=barPos(v2);}
  else {const u=eio(seg(t,11.0,11.9));const s=barPos(v2);pos=[lerp(s[0],rest[0],u),lerp(s[1],rest[1],u)-Math.sin(Math.PI*u)*140];}
  // panel rise offset follows panel while visible
  let yoff=0; if(t>=2.5&&t<11.0) yoff=rise;
  
  if(t>=11.0){ const u=seg(t,11.0,11.9); yoff=lerp(0,0,u);}
  // squash/bounce: landing + leader pulse
  const leadHit=(k==0)?seg(t,4.5,4.9):(k==1?seg(t,8.2,8.6):0);
  const lead=(k==0&&t>=4.5&&t<6.7)||(k==1&&t>=8.2&&t<11);
  const hop=lead?Math.sin(Math.PI*cl(leadHit))*34:0;
  const hop2=(k==0&&t>=3.6&&t<4.5)?0:0;
  // idle bob when resting on card
  const bob=(t<2.5||t>=11.9)?idle(k*2,12):2.5*Math.sin(t*5+k*2);
  // gentle perspective nod (v9): +-13deg
  rotX=20*Math.sin(2*Math.PI*t/2.6+k); rotY=-22*Math.sin(2*Math.PI*t/3.1+k*1.7);
  const parX=idle(k*.9,5)*.9; // layer 1.4 parallax
  let X=pos[0]+parX, Y=pos[1]+yoff-hop+bob;
  // tokens visible from 0.9
  const vis=eo(seg(t,.9,1.5));
  el.style.opacity=vis;
  const s2=lead&&leadHit<1?1+.08*Math.sin(Math.PI*leadHit):1;
  const sq=1-0.1*Math.sin(Math.PI*cl((t-3.5)/.25))*(t>=3.5&&t<3.75&&1);
  el.style.left=X+'px';el.style.top=Y+'px';
  el.style.transform=`rotateX(${rotX}deg) rotateY(${rotY}deg) scale(${s2*(k?1:1)},${s2*sq})`;
  // shadow on surface beneath: contact shadow offset along light dir
  sh.style.left=(X+8+ -sx*14)+'px';sh.style.top=(Y+78+hop*.15)+'px';sh.style.opacity=vis*cl(1-hop/70,.4,1);
  sh.style.transform=`scale(${1-hop/160})`;
 }
 tok(0,'tkA','tsA');tok(1,'tkB','tsB');
 // rail: arrives with soft drop, tiny sheen
 const rl=eo(seg(t,.7,1.4));const R=$('rail');R.style.opacity=rl;R.style.transform=`translateY(${(1-rl)*-18+1.5*Math.sin(t*3)}px)`;
}
window.setT=setT;
</script></body></html>
